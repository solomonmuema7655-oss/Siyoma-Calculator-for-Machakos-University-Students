name: Build SIYOMA CALCULATOR APK

on:
  workflow_dispatch:
  push:

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "build-tools;37.0.0"

      - name: Extract calculator project
        run: |
          mkdir -p extracted
          unzip -q *.zip -d extracted

          echo "=== Extracted files ==="
          find extracted -maxdepth 4 -type f | head -100

      - name: Locate Buildozer project
        run: |
          SPEC_FILE=$(find extracted -name "buildozer.spec" -type f -print -quit)

          if [ -z "$SPEC_FILE" ]; then
            echo "ERROR: buildozer.spec was not found inside the ZIP."
            echo "=== ZIP contents ==="
            unzip -l *.zip
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SPEC_FILE")

          echo "Buildozer project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.37

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          buildozer android debug

      - name: Find APK
        run: |
          echo "=== APK files ==="
          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SIYOMA-CALCULATOR-APK
          path: |
            ${{ env.PROJECT_DIR }}/bin/*.apk
