name: Build SIYOMA CALCULATOR APK

on:
  workflow_dispatch:
  push:

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$ANDROID_HOME" \
            --licenses || true

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "build-tools;37.0.0"

      - name: Extract calculator project
        run: |
          mkdir -p extracted
          unzip -q *.zip -d extracted

          echo "=== ZIP CONTENTS ==="
          find extracted -maxdepth 4 -type f | head -100

      - name: Locate Buildozer project
        run: |
          SPEC_FILE=$(find extracted -name "buildozer.spec" -type f -print -quit)

          if [ -z "$SPEC_FILE" ]; then
            echo "ERROR: buildozer.spec was not found."
            unzip -l *.zip
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SPEC_FILE")

          echo "Project found at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configure Buildozer SDK
        run: |
          SPEC="$PROJECT_DIR/buildozer.spec"

          echo "Configuring Buildozer to use GitHub's Android SDK..."

          if grep -q '^android.sdk_path' "$SPEC"; then
            sed -i "s|^android.sdk_path.*|android.sdk_path = $ANDROID_HOME|" "$SPEC"
          else
            printf '\nandroid.sdk_path = %s\n' "$ANDROID_HOME" >> "$SPEC"
          fi

          if grep -q '^android.accept_sdk_license' "$SPEC"; then
            sed -i 's/^android.accept_sdk_license.*/android.accept_sdk_license = True/' "$SPEC"
          else
            printf '\nandroid.accept_sdk_license = True\n' >> "$SPEC"
          fi

          echo "=== SDK CONFIGURATION ==="
          grep -E '^android\.(sdk_path|accept_sdk_license)' "$SPEC"

      - name: Verify Android Build Tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME/build-tools"
          test -x "$ANDROID_HOME/build-tools/37.0.0/aidl"
          echo "AIDL found successfully."

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.37

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          buildozer android debug

      - name: Find APK
        run: |
          echo "=== APK FILES ==="
          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SIYOMA-CALCULATOR-APK
          path: |
            ${{ env.PROJECT_DIR }}/bin/*.apk
