name: Build SIYOMA Calculator V2 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==1.6.0
          pip install cython==0.29.37

      - name: Clean previous build files
        run: |
          rm -rf .buildozer
          rm -rf bin
          mkdir -p bin

      - name: Build SIYOMA Calculator V2
        run: |
          buildozer android debug

      - name: Find generated APK
        run: |
          echo "Checking for generated APK..."
          find bin -type f -name "*.apk" -print

      - name: Prepare APK artifact
        run: |
          mkdir -p artifacts
          APK_FILE=$(find bin -type f -name "*.apk" | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          cp "$APK_FILE" \
            "artifacts/SiyomaCalculatorMachakosUniversityStudents-V2.apk"

      - name: Upload V2 APK
        uses: actions/upload-artifact@v4
        with:
          name: SIYOMA-CALCULATOR-FOR-MACHAKOS-UNIVERSITY-STUDENTS-V2
          path: artifacts/SiyomaCalculatorMachakosUniversityStudents-V2.apk
